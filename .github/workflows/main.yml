name: Build macOS GUI App (.app)

# main 브랜치 push 또는 PR 발생 시 실행
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-macos-app:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: [3.11, 3.17]  # 최신 macOS Runner에서 지원되는 Python

    steps:
      # 1. 코드 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Python 설치
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      # 3. pip, setuptools, wheel, pyinstaller 업그레이드
      - name: Upgrade pip and install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel pyinstaller
          pip install PyQt5 psutil pynput

      # 4. PyInstaller로 .app 빌드
      - name: Build macOS GUI App (.app)
        run: |
          pyinstaller \
            --windowed \
            --name MyApp \
            --distpath dist \
            my_app/main.py

      # 5. 빌드 결과 업로드
      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyApp-macOS
          path: dist/MyApp.app
